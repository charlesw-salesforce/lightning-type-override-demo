<template>
  <section class="slds-card slds-p-around_medium container">
    <div class="slds-m-bottom_medium">
      <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
        <h2 class="slds-text-heading_small">Book a Reservation</h2>
      </div>
    </div>

    <div class="slds-grid slds-gutters slds-m-bottom_medium">
      <div class="slds-col slds-size_1-of-3">
        <lightning-input
          type="date"
          label="Date"
          name="reservationDate"
          value={value.reservationDate}
          onchange={handleInputChange}
          required
        ></lightning-input>
      </div>

      <div class="slds-col slds-size_1-of-3">
        <lightning-combobox
          label="Time"
          name="startTime"
          value={value.startTime}
          options={timeOptions}
          onchange={handleInputChange}
          required
        ></lightning-combobox>
      </div>

      <div class="slds-col slds-size_1-of-3">
        <lightning-input
          type="number"
          label="Guests"
          name="numberOfGuests"
          value={value.numberOfGuests}
          min="1"
          onchange={handleInputChange}
          required
        ></lightning-input>
      </div>
    </div>

    <div class="slds-grid slds-gutters slds-m-bottom_medium">
      <div class="slds-col slds-size_1-of-2">
        <lightning-input
          type="text"
          label="Name"
          name="guestName"
          value={value.guestName}
          onchange={handleInputChange}
          required
        ></lightning-input>
      </div>

      <div class="slds-col slds-size_1-of-2">
        <lightning-input
          type="tel"
          label="Phone"
          name="phone"
          value={value.phone}
          onchange={handleInputChange}
          required
        ></lightning-input>
      </div>
    </div>

    <div class="slds-m-bottom_medium">
      <label class="slds-form-element__label">Seating Type</label>
      <div class="seating-grid">
        <template for:each={seatingOptions} for:item="opt">
          <div key={opt.value} class="seating-block">
            <button
              onclick={handleSeatingClick}
              data-value={opt.value}
              type="button"
              class={opt.buttonClass}
              aria-label={opt.label}
            >
              <span class="seating-label">{opt.label}</span>
            </button>
          </div>
        </template>
      </div>
    </div>

    <div class="slds-grid slds-gutters slds-m-bottom_medium">
      <div class="slds-col slds-size_1-of-1">
        <lightning-textarea
          label="Special Requests"
          name="specialRequests"
          value={value.specialRequests}
          onchange={handleInputChange}
        ></lightning-textarea>
      </div>
    </div>

    <template if:true={toast.visible}>
      <div
        class="slds-notify slds-notify_toast slds-theme_alert-texture slds-theme_error slds-m-top_medium toast-message"
        role="status"
      >
        <span class="slds-assistive-text">Error</span>
        <div class="slds-notify__content">
          <h2 class="slds-text-heading_small">{toast.message}</h2>
        </div>
      </div>
    </template>
  </section>
</template>
