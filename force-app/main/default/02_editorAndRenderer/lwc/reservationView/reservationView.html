<template>
  <section class="slds-card slds-p-around_medium container">
    <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
      <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
        <h2 class="slds-text-heading_small">Book a Reservation</h2>
      </div>

      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
        <lightning-input
          type="date"
          label="Date"
          name="reservationDate"
          value={value.reservationDate}
          onchange={handleInputChange}
        ></lightning-input>
      </div>

      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
        <lightning-input
          type="time"
          label="Time"
          name="centerTime"
          value={centerTime}
          onchange={handleInputChange}
        ></lightning-input>
      </div>

      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
        <lightning-combobox
          label="Area"
          name="resourceName"
          value={value.resourceName}
          options={resourceOptions}
          onchange={handleInputChange}
        ></lightning-combobox>
      </div>
    </div>

    <template if:true={loading}>
      <div class="slds-is-relative slds-m-vertical_medium">
        <lightning-spinner
          alternative-text="Loading"
          size="small"
        ></lightning-spinner>
      </div>
    </template>

    <template if:false={loading}>
      <div class="slds-m-bottom_medium">
        <div class="time-grid">
          <template for:each={visibleBlocks} for:item="blk">
            <div key={blk.blockId} class="time-block">
              <template if:true={blk.isAvailable}>
                <button
                  onclick={handleBlockClick}
                  data-start={blk.startTime}
                  type="button"
                  class={blk.buttonClass}
                  aria-label={blk.displayTime}
                >
                  <span class="time">{blk.displayTime}</span>
                </button>
              </template>
              <template if:false={blk.isAvailable}>
                <button
                  disabled
                  type="button"
                  class="time-button unavailable"
                  aria-label={blk.displayTime}
                >
                  <span class="time">{blk.displayTime}</span>
                </button>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <div class="slds-grid slds-wrap slds-gutters">
      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
        <lightning-input
          type="email"
          label="Email"
          name="email"
          value={value.email}
          onchange={handleInputChange}
          required
        ></lightning-input>
      </div>

      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
        <lightning-input
          type="tel"
          label="Phone"
          name="phone"
          value={value.phone}
          onchange={handleInputChange}
        ></lightning-input>
      </div>
    </div>

    <template if:true={toast.visible}>
      <div
        class="slds-notify slds-notify_toast slds-theme_alert-texture slds-theme_error slds-m-top_medium toast-message"
        role="status"
      >
        <span class="slds-assistive-text">Error</span>
        <div class="slds-notify__content">
          <h2 class="slds-text-heading_small">{toast.message}</h2>
        </div>
      </div>
    </template>
  </section>
</template>
